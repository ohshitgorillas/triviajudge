# This repository runs its own gates over itself. The three trivia hooks below
# are the ones this package ships in .pre-commit-hooks.yaml, wired as local
# hooks against the checkout's venv so a commit here judges the working tree
# rather than an installed release.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$

      - id: xenon
        name: xenon complexity gate
        entry: .venv/bin/xenon --max-absolute B --max-average A --max-modules A triviajudge
        language: system
        pass_filenames: false
        types: [python]
      - id: vulture
        name: vulture dead-code gate
        entry: .venv/bin/vulture
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: import-linter
        name: import layering gate
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
        types: [python]

      - id: check-jsonschema-workflows
        name: github workflows against the github-workflows schema
        entry: .venv/bin/check-jsonschema --builtin-schema vendor.github-workflows
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      # No builtin pre-commit-hooks schema ships in check-jsonschema; the vendored
      # copy at scripts/schemas/pre-commit-hooks.json (source: SchemaStore) is
      # what keeps this offline.
      - id: check-jsonschema-hooks-manifest
        name: .pre-commit-hooks.yaml against the pre-commit-hooks schema
        entry: .venv/bin/check-jsonschema --schemafile scripts/schemas/pre-commit-hooks.json
        language: system
        files: ^\.pre-commit-hooks\.yaml$

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: single-assertion
        name: one assertion per test
        entry: .venv/bin/python scripts/gates/check_test_assertions.py
        language: system
        types: [python]
        files: ^tests/

      - id: no-copy-assertions
        name: no copy in assertions
        entry: .venv/bin/python scripts/gates/check_no_copy_assertions.py
        language: system
        types: [python]
        files: ^tests/

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest -q --cov=triviajudge --cov-branch --cov-report=term-missing --cov-report=json:.coverage.json --junitxml=.pytest-junit.xml
        language: system
        pass_filenames: false
        always_run: true

      # Reads the report the hook above writes, so it runs after it. No
      # fail_fast here, so it also runs when that hook reds — hence the gate
      # refusing a missing report rather than passing.
      - id: coverage-floor
        name: per-file coverage floor
        entry: .venv/bin/python scripts/gates/check_coverage_floor.py
        language: system
        pass_filenames: false
        always_run: true

      # Reads the junit report the pytest hook writes; a red suite is not judged,
      # so this reports the red rather than a time.
      - id: suite-time
        name: suite wall time against the last green run
        entry: .venv/bin/python scripts/gates/check_suite_time.py
        language: system
        pass_filenames: false
        always_run: true

      - id: file-length
        name: max 500 source / 800 test lines, watched files only shrink
        entry: .venv/bin/python scripts/gates/check_file_length.py
        language: system
        types: [python]

      - id: nesting
        name: no function nests more than 4 blocks deep
        entry: .venv/bin/python scripts/gates/check_nesting.py
        language: system
        types: [python]

      - id: no-barrels
        name: no re-export modules or trivial forwarders
        entry: .venv/bin/python scripts/gates/check_no_barrels.py
        language: system
        types: [python]
        exclude: ^tests/

      # The empty dependency list is a property of the shipped package, so the
      # sweep reads it and leaves the gates, which run on the dev extra, alone.
      - id: stdlib-only
        name: the package imports the standard library alone
        entry: .venv/bin/python scripts/gates/check_stdlib_only.py
        language: system
        types: [python]
        files: ^triviajudge/.*\.py$

      - id: call-timeouts
        name: every call that waits states a timeout
        entry: .venv/bin/python scripts/gates/check_call_timeouts.py
        language: system
        types: [python]
        exclude: ^tests/

      # Screens the bullets the commit adds under [Unreleased], then asks the
      # judge about the ones the screen leaves, so it needs the `claude` CLI and
      # the network as the other two judges do.
      - id: changelog-style
        name: changelog entries read as release notes (LLM judge)
        entry: .venv/bin/triviajudge-changelog
        language: system
        files: ^CHANGELOG\.md$

      # Cross-cutting: a citation names a heading, so the gate has to run when
      # either the citing source or the cited document moves.
      - id: doc-refs
        name: doc citation gate
        entry: .venv/bin/python scripts/gates/check_doc_refs.py
        language: system
        types_or: [python, markdown]

      # Cross-cutting: a clone has two ends and either one can move, and the
      # threshold is a whole-tree percentage, so the gate reads the entire source
      # set from .jscpd.json rather than the staged filenames.
      - id: jscpd
        name: copy-paste duplication gate
        entry: npx jscpd
        language: system
        pass_filenames: false
        files: ^(triviajudge|scripts|tests)/.*\.py$

      # Cross-cutting: one gate is named in pyproject.toml, .pre-commit-hooks.yaml
      # and hooks.json, so this runs when any of the three moves.
      - id: control-catalog
        name: gate catalog cross-check
        entry: .venv/bin/python scripts/gates/check_control_catalog.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.pre-commit-hooks\.yaml|hooks/hooks\.json)$

      # The settings surface and the prose describing it sit in two files, so
      # either one moving is what has to trigger the pairing check.
      - id: settings-docs
        name: settings documented both ways
        entry: .venv/bin/python scripts/gates/check_settings_docs.py
        language: system
        pass_filenames: false
        files: ^(triviajudge/config\.py|README\.md)$

      # Cross-cutting: the version, the changelog and the tags are three places,
      # so either file moving is what has to trigger the comparison. The tags it
      # reads come from git, not from the staged paths.
      - id: release
        name: version, changelog and tags name one release
        entry: .venv/bin/python scripts/gates/check_release.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|CHANGELOG\.md)$

      # Wiring drifts when either config moves, and neither is a source file any
      # types: selector matches, so this one always runs.
      - id: gates-wired
        name: gate wiring gate
        entry: .venv/bin/python scripts/gates/check_gates_wired.py
        language: system
        pass_filenames: false
        always_run: true

      # Runs at the commit-msg stage, so it gets the message file, not the staged
      # paths; `default_install_hook_types` at the top is what makes `pre-commit
      # install` wire that stage alongside pre-commit.
      - id: commit-msg-archaeology
        name: commit-message archaeology gate
        entry: .venv/bin/python scripts/gates/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: archaeology
        name: decision-archaeology gate
        entry: .venv/bin/triviajudge-archaeology
        language: system
        types: [python]
        exclude: ^tests/

      - id: comment-trivia
        name: comments state what holds now (LLM judge)
        entry: .venv/bin/triviajudge-comments
        language: system
        types: [python]
        exclude: ^tests/

      - id: md-trivia
        name: markdown states what holds now (LLM judge)
        entry: .venv/bin/triviajudge-md
        language: system
        files: \.md$
        exclude: ^CHANGELOG\.md$

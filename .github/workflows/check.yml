name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `requires-python` admits, and the version the development
        # host runs. Both are checked, because a package that claims 3.12 and is
        # only ever run on 3.14 claims something nobody has tested.
        python-version: ["3.12", "3.14"]
    steps:
      # Full history and tags, not a shallow clone: the Makefile enumerates the
      # archaeology gate's inputs with `git ls-files`, and the release gate's
      # rule 4 reads `git tag --list` to pair every released CHANGELOG entry
      # with its tag. A shallow clone sees only the tag being pushed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The Makefile hardcodes .venv/bin, so CI builds the same venv layout a
      # dev host has rather than reaching for a system interpreter.
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          # Not in the dev extra: PyPI refuses an upload whose metadata names a
          # git dependency. Pinned by commit, as the actionlint download is.
          .venv/bin/pip install "filepawl @ git+https://github.com/ohshitgorillas/filepawl@dafec4a8bfb9e00d99d1b3e8c44137338a0346ad"

      # No package named `actionlint` on npm is the upstream project — the
      # Makefile's workflow lint line needs the real binary on PATH, pinned and
      # checksummed like any other release download.
      - name: install actionlint
        run: |
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          rm actionlint.tgz
          sudo mv actionlint /usr/local/bin/actionlint

      # `make check` is the offline half: the two LLM judges live in `make
      # trivia`, which needs a logged-in claude CLI that CI does not have.
      - name: make check
        run: make check

      # `make check` is the venv-only, non-git half; the hooks below add the
      # duplication gate, the manifest and workflow linters, and the file-level
      # checks that only run at commit time. The three network judges are the
      # only hooks this skips — everything else that runs on a commit runs here.
      - name: pre-commit run --all-files
        run: .venv/bin/pre-commit run --all-files
        env:
          # The local ids, as .pre-commit-config.yaml spells them; the third
          # judge is wired here as `changelog-style`, not `changelog-trivia`.
          SKIP: md-trivia,comment-trivia,changelog-style

      # The manifests are not Python, so `make check` says nothing about them.
      # `--strict` fails on what the runtime tolerates, because a plugin that
      # loads with warnings is one a consumer sees the warnings for.
      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json
